[package]
publish = false
name = "aw-desktop"
default-run = "aw-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["gui"]
# The app with its window. Without it, what is left is the store, the network
# and the host — for the server (`aw-server`), which runs without a screen.
gui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-window-state", "dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
custom-protocol = ["gui", "tauri/custom-protocol"]

[[bin]]
name = "aw-desktop"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "aw-server"
path = "src/bin/aw-server.rs"

[lib]
name = "aw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
aw-crypto.workspace = true
aw-model.workspace = true
aw-policy.workspace = true
aw-store.workspace = true
aw-sync.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal"] }
hex = "0.4.3"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.3", optional = true }
tauri-plugin-window-state = { version = "2.4.1", optional = true }
tauri-plugin-updater = { version = "2.10", optional = true }
tauri-plugin-process = { version = "2.3", optional = true }
thiserror.workspace = true
tempfile = "3"
# The server's AW_LOG: what the network does, for finding why nobody gets through.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
